<style>

/* Fondo oscuro: se reasignan los tokens del sistema y se invierten las rampas,
   para que los mismos pasos sigan pesando igual sobre un fondo oscuro. */
:root {
  --color-bg: #1c1815;
  --color-surface: #272220;
  --color-text: #f4ebdd;
  --color-divider: color-mix(in srgb, #f4ebdd 16%, transparent);
  --color-accent: #e08b4f;
  --color-accent-2: #9bad78;

  --color-neutral-100: #302a25;
  --color-neutral-200: #3a332d;
  --color-neutral-300: #463e37;
  --color-neutral-400: #6d6359;
  --color-neutral-500: #8f8578;
  --color-neutral-600: #ab9f91;
  --color-neutral-700: #c8bbaa;
  --color-neutral-800: #e2d7c6;
  --color-neutral-900: #f4ebdd;

  --color-accent-100: #37200f;
  --color-accent-200: #6b3714;
  --color-accent-300: #8c491a;
  --color-accent-400: #b2622d;
  --color-accent-500: #d67f48;
  --color-accent-600: #f6a06b;
  --color-accent-700: #ffc0a0;
  --color-accent-800: #ffd3b5;
  --color-accent-900: #fff2eb;

  --color-accent-2-100: #232a18;
  --color-accent-2-200: #3a4726;
  --color-accent-2-300: #56633f;
  --color-accent-2-400: #728157;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #a8bb88;
  --color-accent-2-700: #ccdbb2;
  --color-accent-2-800: #dcebc4;
  --color-accent-2-900: #f0fae1;

  --tropi-chip: #f4ebdd;
}

/* Tipografía: grotesca geométrica en bold para los títulos, en lugar del display. */
:root {
  --font-heading: "Montserrat", system-ui, sans-serif;
  --font-heading-weight: 800;
}
h1, h2, h3, h4 { letter-spacing: -0.025em; }
.btn { font-weight: 700; letter-spacing: 0.01em; }
.nw { white-space: nowrap; }
body { margin: 0; background: var(--color-bg); }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }

/* El mismo <aside> sirve de barra lateral fija en escritorio y de drawer en celular:
   una sola lista de navegación, dos posiciones. */
.shell-aside { background: var(--color-surface); display: flex; flex-direction: column; }
.aside-fija { width: 264px; flex: none; height: 100dvh; position: sticky; top: 0; border-right: 1px solid var(--color-divider); }
.aside-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 20; border-radius: 0 28px 28px 0; animation: shellIn .2s ease-out; }
.shell-back { position: fixed; inset: 0; background: rgba(12, 10, 9, .62); z-index: 10; animation: shellFade .2s ease-out; }
@keyframes shellIn { from { transform: translateX(-14px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes shellFade { from { opacity: 0; } to { opacity: 1; } }
.shell-row { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: none; cursor: pointer; font-family: var(--font-body); background: transparent; }
.shell-row:hover { background: var(--color-neutral-100); }
.shell-tap { border: none; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 999px; }
.shell-tap:hover { background: var(--color-neutral-100); }
</style>
</helmet>

    ] },
  { id: 'admin', label: 'Administración',
    p1: 'M4 21v-7M4 10V3', p2: 'M12 21v-9M12 8V3', p3: 'M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
    items: [
      { id: 'ad-cursos', label: 'Cursos y tarifas' },
      { id: 'ad-precios', label: 'Precios y paquetes' },
      { id: 'ad-parametros', label: 'Parámetros de la escuela' },
      { id: 'ad-usuarios', label: 'Usuarios y roles' }
    ] },
  { id: 'reportes', label: 'Reportes',
    p1: 'M3 3v18h18', p2: 'M7 16v-6M12 16v-10M17 16v-3', p3: '',
    items: [
      { id: 're-mes', label: 'Resumen mensual' },
      { id: 're-cursos', label: 'Ingresos por curso' }
    ] }
];

const TABS_PROFE = [
  { id: 'clases', label: 'Mis clases de hoy', archivo: 'Tomar asistencia.dc.html' },
  { id: 'liquidacion', label: 'Mi liquidación del mes' }
];

const USUARIOS = {
  admin: { nombre: 'Natalia Salek', rol: 'admin' },
  gerente: { nombre: 'Natalia Salek', rol: 'gerente' },
  asistente: { nombre: 'Carolina Ortiz', rol: 'asistente' },
  profesora: { nombre: 'Carla Méndez', rol: 'profesora' }
};

const iniciales = (n) => String(n).trim().split(' ').slice(0, 2).map((p) => p[0]).join('').toUpperCase();

class Component extends DCLogic {
  state = { activo: 'co-inscribir', abierto: 'cobros', drawer: false, tab: 'clases', ancho: 1280 };

  medir = () => this.setState({ ancho: window.innerWidth });

  componentDidMount() {
    this.medir();
    window.addEventListener('resize', this.medir);
  }

  componentWillUnmount() { window.removeEventListener('resize', this.medir); }

  renderVals() {
    const s = this.state;
    const rol = this.props.rol ?? 'admin';
    const esProfesora = rol === 'profesora';
    const esMovil = (this.props.forzarMovil ?? false) || s.ancho < CORTE_MOVIL;
    const marcar = this.props.marcarListas ?? true;
    const u = USUARIOS[rol] || USUARIOS.admin;

    // Destino activo: un ítem del árbol del administrador o una de las dos pestañas de la profesora.
    let grupoActivo = null;
    let itemActivo = null;
    NAV.forEach((g) => g.items.forEach((it) => {
      if (it.id === s.activo) { grupoActivo = g; itemActivo = it; }
    }));
    const tabActiva = TABS_PROFE.filter((t) => t.id === s.tab)[0] || TABS_PROFE[0];
    const destinoActual = esProfesora ? tabActiva : (itemActivo || NAV[1].items[0]);

    const grupos = NAV.map((g) => {
      const abierto = s.abierto === g.id;
      const enRuta = grupoActivo && grupoActivo.id === g.id;
      return {
        label: g.label, p1: g.p1, p2: g.p2 || '', p3: g.p3 || '',
        abierto,
        chevron: abierto ? 'm18 15-6-6-6 6' : 'm6 9 6 6 6-6',
        enRuta: !!enRuta,
        fueraDeRuta: !enRuta,
        // Acordeón: un solo grupo abierto por vez, para que los siete se sigan leyendo de un vistazo.
        toggle: () => this.setState({ abierto: abierto ? null : g.id }),
        items: g.items.map((it) => ({
          label: it.label,
          listo: marcar && !!it.archivo,
          activo: it.id === s.activo,
          inactivo: it.id !== s.activo,
          ir: () => this.setState({ activo: it.id, drawer: false })
        }))
      };
    });

    return {
      esAdmin: !esProfesora,
      esProfesora,
      esMovil,
      verAside: !esMovil || s.drawer,
      verBackdrop: esMovil && s.drawer,
      asideClase: esMovil ? 'aside-drawer' : 'aside-fija',
      abrirDrawer: () => this.setState({ drawer: true }),
      cerrarDrawer: () => this.setState({ drawer: false }),

      grupos,
      ruta: grupoActivo ? grupoActivo.label : '',
      destino: destinoActual.label,
      archivo: destinoActual.archivo || null,
      montaje: destinoActual.archivo
        ? 'Esta pantalla ya está diseñada. El shell le da el marco: la navegación, el usuario y la sesión salen de acá, así que la pantalla ya no lleva su propio encabezado.'
        : 'Acá se monta la pantalla. El shell aporta navegación, usuario y sesión; la pantalla aporta su título y su contenido.',

      usuarioNombre: u.nombre,
      usuarioRol: u.rol,
      inicial: iniciales(u.nombre),

      profeMovil: esMovil,
      profeEscritorio: !esMovil,
      tabs: TABS_PROFE.map((t) => ({
        label: t.label,
        activo: t.id === s.tab,
        inactivo: t.id !== s.tab,
        ir: () => this.setState({ tab: t.id })
      })),
      tabClasesActivo: s.tab === 'clases',
      tabClasesInactivo: s.tab !== 'clases',
      tabLiqActivo: s.tab === 'liquidacion',
      tabLiqInactivo: s.tab !== 'liquidacion',
      irClases: () => this.setState({ tab: 'clases' }),
      irLiquidacion: () => this.setState({ tab: 'liquidacion' })
    };
  }
}

</script>
</body>
</html>
